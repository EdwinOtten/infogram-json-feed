name: Update exchange rates

on:
  schedule:
    # Runs every 10 minutes during Dutch office hours.
    # UTC cron: 07:00-16:59 (Amsterdam/CEST is UTC+2 in summer, UTC+1 in winter)
    - cron: '*/10 7-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Amsterdam

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Randomize numeric values in data.json
        run: |
          python3 - <<'PY'
          import json
          import random

          with open('data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          # data structure:
          # [ [header row], [currency row], [currency row], ... ]
          # each currency row looks like ["Currency name", number, number, ...]
          for row in data[0][1:]:
              for i in range(1, len(row)):
                  row[i] = random.randint(100, 999)

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update exchange rates $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Show summary
        if: always()
        run: |
          echo "## Rate refresh completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"